# git-cliff (https://git-cliff.org) settings for CHANGELOG.md, used by
# scripts/release.sh. Conventional Commits become Keep a Changelog sections:
# feat → Added, fix → Fixed, perf and other breaking commits → Changed;
# docs, test, chore, style, build, ci and refactor commits stay out.

[changelog]
header = """
# Changelog

All notable changes to tabby are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# TABBY_MIHOMO_TAG is set by scripts/release.sh for the section it adds.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% set mihomo = get_env(name="TABBY_MIHOMO_TAG", default="") -%}
    {% if mihomo %}
        The `-with-mihomo` archives ship mihomo {{ mihomo }}.
    {% endif -%}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Changed" },
    { field = "breaking", pattern = "true", group = "<!-- 2 -->Changed" },
    { message = ".*", skip = true },
]

[bump]
# 0.x: a breaking change bumps the minor version, a feature the minor too,
# a fix the patch.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
