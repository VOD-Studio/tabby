[package]
name = "tabby"
version = "0.2.2"
edition = "2024"
license = "MIT"

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
jiff = "0.2.39"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "socks"] }
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.0"
toml_edit = { version = "0.25.18", default-features = false, features = ["parse", "display"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-input = "0.15.5"
unicode-width = "0.2.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.54.1", features = ["test-util"] }
