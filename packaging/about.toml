# cargo-about: the licenses of the crates built into tabby, for
# THIRD-PARTY-LICENSES in the release archives (scripts/dist.sh). Of an
# `A OR B` the first accepted one here is taken.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
